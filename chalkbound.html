<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080909">
  <title>Chalkbound</title>
  <style>
    :root {
      color-scheme: dark;
      background: #080909;
      color: #f2f2e9;
      font-family: "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: #080909;
    }
    main {
      width: min(100vw - 24px, 1152px);
      border: 4px solid #f2f2e9;
      background: #000;
      box-shadow: 0 0 0 4px #000, 0 0 0 5px #f2f2e9;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
      touch-action: none;
      outline: none;
    }
    @media (max-aspect-ratio: 4 / 3) {
      main { width: min(100vw - 16px, calc((100vh - 24px) * 16 / 9)); }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" width="384" height="216" tabindex="0" aria-label="Chalkbound dungeon crawler game"></canvas>
  </main>
  <script src="chalkbound.js"></script>
</body>
</html>
